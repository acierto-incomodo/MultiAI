<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MultiAI - Actualizaciones</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/updates.css">
  </head>

  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="header">
        <div class="header-content">
          <div class="logo">
            <span class="logo-icon">📦</span>
            <span>MultiAI</span>
          </div>
          <div class="header-actions">
            <button class="icon-button" onclick="goBack()" title="Atrás">
              <span class="material-icons">arrow_back</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <div class="welcome-section">
          <h1 class="welcome-title">Actualizaciones</h1>
          <p class="welcome-subtitle">
            Verifica la disponibilidad de nuevas versiones de MultiAI
          </p>
        </div>

        <div class="update-card">
          <div id="updateStatus">
            <div class="spinner"></div>
            <div class="status-title">Buscando actualizaciones...</div>
            <p class="status-text">
              Por favor espera mientras verificamos si hay nuevas versiones
              disponibles.
            </p>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" onclick="checkForUpdates()">
            <span class="material-icons">refresh</span>
            Verificar de nuevo
          </button>
          <button class="btn btn-secondary" onclick="goBack()">
            <span class="material-icons">arrow_back</span>
            Atrás
          </button>
        </div>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <p id="version-text">
          MultiAI - Centro de Asistentes de IA. Desarrollado por
          StormGamesStudios
        </p>
      </footer>
    </div>

    <script>
      const statusDiv = document.getElementById("updateStatus");

      async function checkForUpdates() {
        // Mostrar estado de carga inmediatamente para dar feedback al usuario
        statusDiv.innerHTML = `
                <div class="spinner"></div>
                <div class="status-title">Buscando actualizaciones...</div>
                <p class="status-text">Por favor espera mientras verificamos si hay nuevas versiones disponibles.</p>
            `;
        if (window.electronAPI) {
          window.electronAPI.checkForUpdates();
        } else {
          console.warn(
            "electronAPI no disponible. No se puede buscar actualizaciones.",
          );
          statusDiv.innerHTML = `
                    <span class="material-icons update-status update-status-error">error</span>
                    <div class="status-title">Error de Conexión</div>
                    <p class="status-text">La API de la aplicación no está disponible. No se puede buscar actualizaciones.</p>
                `;
        }
      }

      if (window.electronAPI) {
        window.electronAPI.onUpdateState((event, state, data) => {
          switch (state) {
            case "checking-for-update":
              statusDiv.innerHTML = `
                            <div class="spinner"></div>
                            <div class="status-title">Buscando actualizaciones...</div>
                            <p class="status-text">Por favor espera mientras verificamos si hay nuevas versiones disponibles.</p>
                        `;
              break;
            case "update-available":
              statusDiv.innerHTML = `
                            <span class="material-icons update-status update-status-primary">downloading</span>
                            <div class="status-title">¡Actualización encontrada! (v${data.version})</div>
                            <p class="status-text">Descargando la nueva versión en segundo plano. Se te notificará cuando esté lista para instalar.</p>
                        `;
              break;
            case "update-not-available":
              statusDiv.innerHTML = `
                            <span class="material-icons update-status update-status-success">check_circle</span>
                            <div class="status-title">¡Estás actualizado!</div>
                            <p class="status-text">Ya tienes la última versión de MultiAI (v${data.version}).</p>
                        `;
              break;
            case "download-progress":
              statusDiv.innerHTML = `
                            <div class="spinner"></div>
                            <div class="status-title">Descargando... (${Math.round(data.percent)}%)</div>
                            <p class="status-text">
                                Velocidad: ${(data.bytesPerSecond / 1024 / 1024).toFixed(2)} MB/s <br>
                                (${(data.transferred / 1024 / 1024).toFixed(2)} de ${(data.total / 1024 / 1024).toFixed(2)} MB)
                            </p>
                            <div class="update-progress-track">
                                <div class="update-progress-fill"></div>
                            </div>
                        `;
              statusDiv.querySelector(".update-progress-fill").style.width =
                `${data.percent}%`;
              break;
            case "update-downloaded":
              statusDiv.innerHTML = `
                            <span class="material-icons update-status update-status-primary">system_update</span>
                            <div class="status-title">¡Actualización lista para instalar! (v${data.version})</div>
                            <p class="status-text">La nueva versión se ha descargado. Reinicia la aplicación para instalarla.</p>
                            <button class="btn btn-primary update-install-button" onclick="installUpdate()">
                                <span class="material-icons">restart_alt</span>
                                Reiniciar e Instalar Ahora
                            </button>
                        `;
              break;
            case "error":
              statusDiv.innerHTML = `
                            <span class="material-icons update-status update-status-error">error</span>
                            <div class="status-title">Error de actualización</div>
                            <p class="status-text">No se pudo completar la actualización. Revisa tu conexión a internet o inténtalo más tarde.</p>
                            <p class="status-text update-error-message">${data ? data.message : ""}</p>
                        `;
              break;
          }
        });
      }

      function installUpdate() {
        if (window.electronAPI) {
          window.electronAPI.quitAndInstallUpdate();
        }
      }

      async function goBack() {
        try {
          if (window.electronAPI) {
            await window.electronAPI.goBack();
          } else {
            window.history.back();
          }
        } catch (error) {
          console.error("Error al ir atrás:", error);
          window.history.back();
        }
      }

      async function closeApp() {
        try {
          if (window.electronAPI) {
            await window.electronAPI.windowControl("close");
          } else {
            window.close();
          }
        } catch (error) {
          console.error("Error al cerrar la aplicación:", error);
          window.close();
        }
      }

      async function loadVersion() {
        try {
          let version = "1.0.0";

          // Primero intentar obtener desde electronAPI
          if (
            window.electronAPI &&
            typeof window.electronAPI.getAppVersion === "function"
          ) {
            version = await window.electronAPI.getAppVersion();
          } else if (window.electronAPI && window.electronAPI.appVersion) {
            version = window.electronAPI.appVersion;
          } else {
            // Fallback: cargar desde package.json
            const response = await fetch("package.json");
            const packageData = await response.json();
            version = packageData.version;
          }

          const versionElement = document.getElementById("version-text");
          if (versionElement) {
            versionElement.textContent = `MultiAI v${version} - Centro de Asistentes de IA. Desarrollado por StormGamesStudios`;
          }
        } catch (error) {
          console.error("Error al cargar la versión:", error);
        }
      }

      // Inicializar cuando cargue la página
      document.addEventListener("DOMContentLoaded", function () {
        loadVersion();
        // Dispara la búsqueda automáticamente al cargar la página
        checkForUpdates();
      });
    </script>
  </body>
</html>
