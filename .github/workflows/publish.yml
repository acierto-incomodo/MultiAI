name: MultiAI - Publish Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================
  # WINDOWS
  # ==========================================

  release-windows:
    name: Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npx electron-builder --win --publish never

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: MultiAI-Windows
          path: dist/*
          if-no-files-found: error


  # ==========================================
  # LINUX
  # ==========================================

  release-linux:
    name: Release Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder fuse3

      - name: Configure Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npx electron-builder --linux --publish never

      - name: Upload Linux files
        uses: actions/upload-artifact@v4
        with:
          name: MultiAI-Linux
          path: dist/*
          if-no-files-found: error


  # ==========================================
  # PUBLISH RELEASE
  # ==========================================

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - release-windows
      - release-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download Windows builds
        uses: actions/download-artifact@v4
        with:
          name: MultiAI-Windows
          path: release/windows

      - name: Download Linux builds
        uses: actions/download-artifact@v4
        with:
          name: MultiAI-Linux
          path: release/linux

      - name: Prepare release files
        run: |
          mkdir -p release/fotos
          cp fotos/foto*.png release/fotos/

          cp README.md release/README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MultiAI ${{ github.ref_name }}
          body_path: README.md
          files: |
            release/windows/*
            release/linux/*
            release/fotos/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}